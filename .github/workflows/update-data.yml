name: Actualizar calendario de partidos

on:
  schedule:
    # 10:00 y 18:00 UTC = 06:00 y 14:00 hora Chile (aprox, sin considerar horario de verano)
    - cron: "0 10,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer UFC
        run: python scripts/fetch_ufc.py

      - name: Traer ONE Championship
        run: python scripts/fetch_one_championship.py

      - name: Traer fútbol + NBA + Euroliga + rugby (API ESPN, sin key)
        run: python scripts/fetch_espn_sports.py

      - name: Armar data/today.json
        run: python scripts/build_report.py

      - name: Commitear si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today.json data/raw/
          git diff --staged --quiet || git commit -m "Actualizar calendario de partidos [bot]"
          git push
